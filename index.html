<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jetson Robot Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; margin-top: 30px; }
        .container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        img { border-radius: 4px; background: #000; width: 400px; height: 300px; object-fit: contain; }
        .telemetry { font-size: 1.2em; margin-top: 15px; }
        button { padding: 10px 20px; font-size: 1em; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>NVIDIA Jetson Robot Control Panel</h1>
    
    <div class="container">
        <div class="card">
            <h3>Live Camera Output (RGB)</h3>
            <img id="videoStream" alt="Waiting for video feed..." />
        </div>

        <div class="card">
            <h3>2D Top-Down Room Map</h3>
            <img id="mapStream" alt="Waiting for map feed..." />
        </div>

        <div class="card">
            <h3>Motor Telemetry</h3>
            <div class="telemetry">
                <p><strong>Speed:</strong> <span id="motorSpeed">--</span> RPM</p>
                <p><strong>Current Draw:</strong> <span id="motorCurrent">--</span> A</p>
            </div>
            <h3 style="margin-top: 20px;">Robot Controls</h3>
            <button onclick="sendCommand('forward', 50)">Move Forward</button>
            <button onclick="sendCommand('stop', 0)">Stop</button>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <p>Connection Status: <span id="status" style="color: red;">Disconnected</span></p>
    </div>

    <script>
        const socket = io();

        socket.on('connect', function() {
            document.getElementById('status').innerText = 'Connected';
            document.getElementById('status').style.color = 'green';
        });

        socket.on('disconnect', function() {
            document.getElementById('status').innerText = 'Disconnected';
            document.getElementById('status').style.color = 'red';
        });

        function sendCommand(action, val) {
            socket.emit('robot_command', { command: action, speed: val });
        }

        // Handle both video stream and 2D map updates from server
        socket.on('video_frame', function(data) {
            document.getElementById('videoStream').src = 'data:image/jpeg;base64,' + data.image;
            document.getElementById('mapStream').src = 'data:image/jpeg;base64,' + data.map;
        });

        socket.on('motor_update', function(data) {
            document.getElementById('motorSpeed').innerText = data.speed.toFixed(1);
            document.getElementById('motorCurrent').innerText = data.current.toFixed(2);
        });
    </script>
</body>
</html>
